name: WU-BT10 connection problem
description: Report a reproducible Audio, compatibility-mode, switching, or MIDI problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload logs before checking them for information you consider private.
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: Windows 11 25H2, build 26200.x
    validations:
      required: true
  - type: input
    id: instrument
    attributes:
      label: Casio instrument model
      placeholder: PX-S1100
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: Result shown by the app
      options:
        - Pair WU-BT10 AUDIO first
        - WU-BT10 AUDIO is ready
        - WU-BT10 AUDIO is ready in compatibility mode
        - Audio compatibility mode is active
        - Intel offload connected without a playback output
        - Windows Bluetooth Audio hardware is disabled
        - MIDI bridge could not start
        - MIDI connection lost or did not release
        - Repair failed
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and observed behavior
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant diagnostic or repair log excerpt
      description: Logs are under %LOCALAPPDATA%\WU-BT10-Fix. Remove identifiers you consider private.
      render: text
